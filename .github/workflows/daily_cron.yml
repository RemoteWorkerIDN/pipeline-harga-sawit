name: Automation Update Data Komoditas

on:
  schedule:
    # 07:00 WIB sama dengan 00:00 UTC (GitHub Actions menggunakan zona waktu UTC)
    # Berjalan hari Senin sampai Jumat (Senin-Jumat jam 07:00 WIB)
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # Fitur agar bisa dijalankan manual kapan saja via tombol di GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repository ini
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Setup environment Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install library yang dibutuhkan (sudah ditambah pandas)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance gspread google-auth pandas

    # 4. Jalankan script Python dengan memasukkan secret GCP_SA_KEY
    - name: Run main script
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python main.py
